name: Build NEXORA CHQT APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 📦 Create minimal package.json
        run: |
          echo '{
            "name": "nexora-chqt",
            "version": "1.0.0",
            "main": "node_modules/expo/AppEntry.js"
          }' > package.json
      
      - name: 🔧 Install all dependencies with Expo
        run: npx expo install expo react react-native @react-navigation/native @react-navigation/bottom-tabs @react-navigation/stack @react-navigation/drawer react-native-paper react-native-vector-icons react-native-safe-area-context react-native-screens expo-notifications expo-image-picker expo-camera expo-file-system expo-media-library expo-av expo-document-picker expo-device expo-constants expo-linking expo-web-browser expo-mail-composer @react-native-async-storage/async-storage react-native-gesture-handler react-native-reanimated react-native-svg uuid moment lodash @babel/core @types/react
      
      - name: 🏗️ Build APK
        run: |
          npx expo export:embed
          npx eas-cli build --platform android --profile production --local --output ./nexora-chqt.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-CHQT-APK
          path: ./nexora-chqt.apk
          retention-days: 30

      - name: 📤 Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./nexora-chqt.apk
          tag_name: v1.0.${{ github.run_number }}
          name: NEXORA CHQT v1.0.${{ github.run_number }}
          body: |
            ## 🚀 NEXORA CHQT APK Build
            
            ### ✨ Features:
            - ✅ Real-time Chat
            - ✅ Voice & Video Calls
            - ✅ Groups with Admin/Moderator
            - ✅ Channels with Subscribers
            - ✅ File Sharing
            - ✅ Premium Features
            - ✅ Dark Theme with Glassmorphism
            - ✅ 20+ Settings Pages
            - ✅ No Backend Required!
            
            ### 👑 Official Accounts:
            | Name | Phone | Role | Badge |
            |------|-------|------|-------|
            | NEXORA CHQT | +1 222-555-0101 | Moderator | 🛡️ |
            | MR PYTHON CODE | +1 555-987-6543 | Owner | 👑 |
            | NEX TECH | +1 555-456-7890 | Developer | 💻 |
            | NEXORA SUPPORT | +1 444-555-0202 | Moderator | 🛡️ |
            
            ### 📢 Official Channel:
            - **NEXORA OFFICIAL CHANNEL**
            - Usernames: @nex, @mrpython
            - Badge: ✅ Verified
            
            ### 🔑 How to use:
            1. Open the app
            2. Enter any phone number above
            3. Enter OTP (any 6 digits)
            4. Done! 🎯
            
            Made with ❤️ by NEXORA Team
