name: Build NEXORA CHQT APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔧 Install Expo CLI
        run: npm install -g expo-cli eas-cli
      
      - name: 🏗️ Build APK
        run: |
          npx expo export:embed
          npx eas-cli build --platform android --profile production --local --output ./nexora-chqt.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-CHQT-APK
          path: ./nexora-chqt.apk
          retention-days: 30

      - name: 📤 Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./nexora-chqt.apk
          tag_name: v1.0.${{ github.run_number }}
          name: NEXORA CHQT v1.0.${{ github.run_number }}
          body: |
            ## 🚀 NEXORA CHQT APK Build
            
            ### ✨ Features:
            - ✅ Real-time Chat (Local Storage)
            - ✅ Voice & Video Calls (WebRTC)
            - ✅ Groups with Admin/Moderator
            - ✅ Channels with Subscribers
            - ✅ File Sharing (Images, Documents, Voice)
            - ✅ Premium Features
            - ✅ Dark Theme with Glassmorphism
            - ✅ 20+ Settings Pages
            - ✅ Per-User Data Storage
            - ✅ Real OTP Verification
            - ✅ No Backend Required!
            
            ### 📱 Installation:
            1. Download the APK below
            2. Enable "Install from Unknown Sources"
            3. Install and Enjoy! 🎉
            
            ### 👑 Official Accounts:
            | Name | Phone | Role | Badge |
            |------|-------|------|-------|
            | NEXORA CHQT | +1 222-555-0101 | Moderator | 🛡️ |
            | MR PYTHON CODE | +1 555-987-6543 | Owner | 👑 |
            | NEX TECH | +1 555-456-7890 | Developer | 💻 |
            | NEXORA SUPPORT | +1 444-555-0202 | Moderator | 🛡️ |
            
            ### 📢 Official Channel:
